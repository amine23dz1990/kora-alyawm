<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b22"><title>كورة اليوم 🇩🇿</title>
<style>
:root{--bg:#0b1713;--p:#142720;--p2:#1a332a;--g:#32d583;--m:#9bb3a8;--l:#29453a;--w:#f5fbf7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--w);font-family:system-ui,Tahoma,Arial,sans-serif}header{padding:22px 18px 16px;background:linear-gradient(135deg,#153d2c,#10241d);border-bottom:1px solid var(--l)}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:25px;font-weight:900}.brand span{color:var(--g)}.pill{font-size:11px;color:#c5f7dc;border:1px solid #367653;padding:5px 9px;border-radius:30px}.sub{color:var(--m);font-size:13px;margin-top:7px}.search{margin-top:16px;width:100%;border:1px solid var(--l);background:#0b1c15;color:var(--w);padding:12px 14px;border-radius:12px;font-size:14px}main{max-width:760px;margin:auto;padding:16px 14px 90px}.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}.tab{white-space:nowrap;border:1px solid var(--l);background:var(--p);color:#c9d9d1;border-radius:30px;padding:9px 15px;font-size:13px}.tab.active{background:var(--g);color:#082015;font-weight:800}.head{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 12px}.head h2{font-size:18px;margin:0}.muted{font-size:12px;color:var(--m)}.notice{background:#2b2514;border:1px solid #625027;color:#f5df9b;padding:10px 12px;border-radius:10px;font-size:12px;margin-bottom:14px;line-height:1.7}.league{border:1px solid var(--l);background:var(--p);border-radius:15px;margin-bottom:12px;overflow:hidden}.leaguehead{padding:12px 14px;background:var(--p2);display:flex;gap:9px;font-weight:800;font-size:14px}.game{display:grid;grid-template-columns:1fr 76px 1fr;align-items:center;gap:7px;padding:15px 10px;border-top:1px solid var(--l)}.team{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650}.team:last-child{justify-content:flex-start}.crest{width:29px;height:29px;border-radius:50%;background:#254738;display:grid;place-items:center;flex-shrink:0}.score{text-align:center;font-size:18px;font-weight:900}.status{font-size:10px;color:var(--m);font-weight:500;display:block;margin-top:4px}.empty{padding:24px 14px;color:var(--m);text-align:center;background:var(--p);border:1px solid var(--l);border-radius:14px;line-height:1.8}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:11px 7px;border-bottom:1px solid var(--l);text-align:center;white-space:nowrap}.table th{color:var(--m)}.table td:first-child,.table th:first-child{text-align:right;padding-right:14px}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#0d1e17;border-top:1px solid var(--l);padding:10px 5px calc(10px + env(safe-area-inset-bottom))}.navbtn{border:0;background:none;color:var(--m);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}.navbtn b{font-size:19px;font-weight:500}.navbtn.active{color:var(--g)}.footer{text-align:center;color:#668073;font-size:10px;margin:20px 0}.refresh{border:1px solid var(--l);background:var(--p);color:var(--g);padding:8px 12px;border-radius:9px}
</style></head><body><header><div class="top"><div class="brand">⚽ كورة <span>اليوم</span></div><div class="pill">الدوري الجزائري 🇩🇿</div></div><div class="sub">نتائج المباريات • المباريات القادمة • ترتيب الفرق</div><input id="search" class="search" placeholder="ابحث عن فريق..."></header><main><div class="tabs"><button class="tab active" data-filter="today">مباريات اليوم</button><button class="tab" data-filter="live">مباشر الآن</button><button class="tab" data-filter="upcoming">المباريات القادمة</button></div><div id="content"><div class="empty">جارٍ تحميل بيانات الدوري الجزائري...</div></div><div class="footer">البيانات من API-Football. قد تتأخر النتائج حسب توفر التغطية.</div></main><nav class="bottom"><button class="navbtn active" data-page="matches"><b>⚽</b>المباريات</button><button class="navbtn" data-page="table"><b>🏆</b>الترتيب</button><button class="navbtn" data-page="about"><b>ℹ️</b>حول</button></nav>
<script>
const content=document.getElementById('content'),search=document.getElementById('search');let page='matches',filter='today',cache={};
const statusAr={NS:'لم تبدأ',1H:'الشوط الأول',HT:'استراحة',2H:'الشوط الثاني',ET:'وقت إضافي',P:'ركلات الترجيح',FT:'انتهت',AET:'انتهت بعد وقت إضافي',PEN:'انتهت بركلات الترجيح',PST:'مؤجلة',CANC:'ألغيت',SUSP:'متوقفة',INT:'توقفت مؤقتًا',TBD:'الموعد غير محدد',LIVE:'مباشرة'};
function dateText(v){try{return new Date(v).toLocaleString('ar-DZ',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Africa/Algiers'})}catch{return ''}}
async function load(type,force=false){if(cache[type]&&!force)return cache[type];const r=await fetch('/.netlify/functions/football?type='+encodeURIComponent(type));const d=await r.json();if(!r.ok)throw new Error(d.message||'تعذر جلب البيانات');cache[type]=d;return d}
function fixtureCard(f){const st=f.fixture?.status||{},home=f.teams?.home||{},away=f.teams?.away||{},goals=f.goals||{};const score=(goals.home==null?'—':goals.home)+' : '+(goals.away==null?'—':goals.away);const live=['1H','2H','HT','ET','P','LIVE'].includes(st.short);return `<div class="game"><div class="team"><span class="crest">⚽</span>${home.name||'الفريق الأول'}</div><div class="score">${score}<span class="status">${live?'🔴 ':''}${statusAr[st.short]||st.long||'النتيجة'}${st.elapsed!=null?' · '+st.elapsed+'′':''}<br>${dateText(f.fixture?.date)}</span></div><div class="team"><span class="crest">⚽</span>${away.name||'الفريق الثاني'}</div></div>`}
async function matchesView(){content.innerHTML='<div class="empty">جارٍ جلب المباريات...</div>';try{const d=await load(filter);let list=d.results||[];const q=search.value.trim().toLocaleLowerCase('ar');list=list.filter(f=>`${f.teams?.home?.name||''} ${f.teams?.away?.name||''}`.toLocaleLowerCase('ar').includes(q));const title={today:'مباريات اليوم',live:'المباريات المباشرة',upcoming:'المباريات القادمة'}[filter];if(!list.length){content.innerHTML=`<div class="head"><h2>${title}</h2><button class="refresh" onclick="refreshData()">تحديث</button></div><div class="empty">لا توجد مباريات متاحة في هذا القسم حاليًا، أو أن التغطية غير متوفرة من مزود البيانات.</div>`;return}content.innerHTML=`<div class="head"><h2>${title}</h2><button class="refresh" onclick="refreshData()">تحديث</button></div><div class="notice">المصدر: API-Football. إذا كانت النتيجة غير ظاهرة، فقد لا تكون التغطية المباشرة متاحة لهذه المباراة.</div><section class="league"><div class="leaguehead">🇩🇿 الدوري الجزائري المحترف الأول</div>${list.map(fixtureCard).join('')}</section>`}catch(e){content.innerHTML=`<div class="empty">⚠️ ${e.message}<br><br>تأكد من إضافة API_FOOTBALL_KEY في إعدادات Netlify ونشر الموقع من جديد.</div>`}}
async function standingsView(){content.innerHTML='<div class="empty">جارٍ تحميل الترتيب...</div>';try{const d=await load('standings');const rows=d.results?.[0]?.league?.standings?.[0]||[];if(!rows.length){content.innerHTML='<div class="empty">لم يُرجع مصدر البيانات جدول ترتيب لهذا الموسم. تحقق من الموسم والتغطية في لوحة API-Football.</div>';return}content.innerHTML=`<div class="head"><h2>ترتيب الدوري الجزائري</h2><button class="refresh" onclick="refreshData()">تحديث</button></div><div class="tablewrap"><section class="league"><div class="leaguehead">🇩🇿 الترتيب الرسمي من مصدر البيانات</div><table class="table"><thead><tr><th>#</th><th>الفريق</th><th>لعب</th><th>فارق الأهداف</th><th>النقاط</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${t.rank}</td><td style="text-align:right">${t.team?.name||'—'}</td><td>${t.all?.played??0}</td><td>${t.goalsDiff??0}</td><td><b>${t.points??0}</b></td></tr>`).join('')}</tbody></table></section></div>`}catch(e){content.innerHTML=`<div class="empty">⚠️ ${e.message}</div>`}}
function aboutView(){content.innerHTML='<div class="empty"><h2>عن كورة اليوم</h2>موقع لمتابعة الدوري الجزائري المحترف الأول.<br>مفتاح API محفوظ في إعدادات الخادم وليس داخل صفحة الموقع.<br><br><a href="https://www.api-football.com/documentation-v3" target="_blank" rel="noopener" style="color:#32d583">توثيق مصدر البيانات</a></div>'}
function render(){if(page==='table')standingsView();else if(page==='about')aboutView();else matchesView()}
async function refreshData(){cache={};render()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;page='matches';document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.page===page));render()});document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');page=b.dataset.page;render()});search.oninput=()=>{cache={};render()};render();
</script></body></html>
